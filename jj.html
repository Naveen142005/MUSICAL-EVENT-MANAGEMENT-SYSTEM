<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snack Selection - Simple</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .bg-white {
            background: white;
        }

        .rounded-lg {
            border-radius: 12px;
        }

        .card-shadow {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .p-6 {
            padding: 1.5rem;
        }

        .mb-4 {
            margin-bottom: 1rem;
        }

        .mb-6 {
            margin-bottom: 1.5rem;
        }

        .primary-text {
            color: #4b0082;
        }

        h2 {
            font-size: 1.875rem;
            font-weight: bold;
            color: #4b0082;
            margin-bottom: 1.5rem;
        }

        h3 {
            font-size: 1.25rem;
            font-weight: 600;
        }

        /* Toggle */
        .toggle-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #9333ea;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            right: 3px;
            bottom: 3px;
            background-color: white;
            border-radius: 50%;
        }

        /* Form Section */
        .food-section {
            background: #f9fafb;
            padding: 1.5rem;
            border-radius: 8px;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: #374151;
            margin-bottom: 0.5rem;
        }

        select, input[type="number"] {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 1rem;
            background: white;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #9333ea;
            box-shadow: 0 0 0 3px rgba(147, 51, 234, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .info-text {
            font-size: 0.875rem;
            color: #6b7280;
            margin-top: 0.5rem;
        }

        .total-box {
            background: white;
            border: 2px solid #4b0082;
            border-radius: 8px;
            padding: 1rem;
            margin-top: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .total-label {
            font-size: 1rem;
            font-weight: 600;
            color: #374151;
        }

        .total-amount {
            font-size: 1.5rem;
            font-weight: 700;
            color: #4b0082;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="bg-white rounded-lg card-shadow p-6">
            <h2>
                <i class="fas fa-star" style="margin-right: 0.5rem;"></i>
                Extras & Add-ons
            </h2>

            <!-- FOOD SECTION -->
            <div class="mb-6">
                <div class="toggle-container">
                    <h3>Do you want food/snacks?</h3>
                    <label class="toggle-switch">
                        <input type="checkbox" checked style="display: none;">
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="food-section">
                    <div class="form-row">
                        <!-- Snack Box Selection -->
                        <div>
                            <label>
                                <i class="fas fa-box" style="margin-right: 0.25rem;"></i>
                                Select Snack Box
                            </label>
                            <select>
                                <option value="">Choose a snack box...</option>
                                <option value="1" selected>Snack Box 1 - ₹500 (Popcorn, Soda, Nachos)</option>
                                <option value="2">Snack Box 2 - ₹1,000 (Orange, Apple)</option>
                                <option value="3">Snack Box 3 - ₹750 (Chips, Cookies, Juice, Sandwiches)</option>
                            </select>
                        </div>

                        <!-- Quantity -->
                        <div>
                            <label>
                                <i class="fas fa-sort-numeric-up" style="margin-right: 0.25rem;"></i>
                                Quantity
                            </label>
                            <input type="number" value="5" min="1" placeholder="0">
                        </div>
                    </div>

                    <p class="info-text">
                        <i class="fas fa-info-circle"></i>
                        Each snack box serves approximately 10 people
                    </p>

                    <!-- Total Cost -->
                    <div class="total-box">
                        <span class="total-label">Total Food Cost:</span>
                        <span class="total-amount">₹2,500</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
