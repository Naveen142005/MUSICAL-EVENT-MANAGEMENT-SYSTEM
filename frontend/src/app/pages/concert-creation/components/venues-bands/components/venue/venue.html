<div class="mb-8">
    <div class="flex items-center justify-between mb-4">
        <h3 class="text-xl font-semibold">Do you want a venue?</h3>
        <label class="relative inline-flex items-center cursor-pointer">
            <input
                type="checkbox"
                [(ngModel)]="wantVenue"
                (change)="toggleVenueSection()"
                class="sr-only peer"
            />
            <div
                class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-purple-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-purple-600"
            ></div>
        </label>
    </div>

    <div id="venueSection" [class.hidden]="!wantVenue">
        <!-- Venue Filters -->
        <div class="bg-gray-50 p-4 rounded-lg mb-6">
            <h4 class="font-semibold mb-4">Search Venues</h4>
            <div>
                <input
                    type="text"
                    [(ngModel)]="venueSearchTerm"
                    (input)="filterVenues()"
                    class="w-full px-3 py-2 border rounded-lg"
                    placeholder="Search by name, location, capacity..."
                />
            </div>
            <br />
            <h4 class="font-semibold mb-4">Filter Venues</h4>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Min Price</label>
                    <input
                        type="number"
                        [(ngModel)]="venueFilters.minPrice"
                        (input)="filterVenues()"
                        class="w-full px-3 py-2 border rounded-lg"
                        placeholder="0"
                    />
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Max Price</label>
                    <input
                        type="number"
                        [(ngModel)]="venueFilters.maxPrice"
                        (input)="filterVenues()"
                        class="w-full px-3 py-2 border rounded-lg"
                        placeholder="100000"
                    />
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Capacity</label>
                    <select
                        [(ngModel)]="venueFilters.capacity"
                        (change)="filterVenues()"
                        class="w-full px-3 py-2 border rounded-lg"
                    >
                        <option value="">Any value</option>
                        <option value="0-500">Under 500</option>
                        <option value="500-1500">500 to 1500</option>
                        <option value="1500-2500">1500 to 2500</option>
                        <option value="2500+">More than 2500</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Min Rating</label>
                    <select
                        [(ngModel)]="venueFilters.minRating"
                        (change)="filterVenues()"
                        class="w-full px-3 py-2 border rounded-lg"
                    >
                        <option value="0">Any Rating</option>
                        <option value="3">3+ Stars</option>
                        <option value="4">4+ Stars</option>
                        <option value="4.5">4.5+ Stars</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Venue List -->
